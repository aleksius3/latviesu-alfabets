<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#fffaf2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Latviešu ABC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Latviešu alfabēts</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title">Latviešu alfabēts</div>
      <button id="topSoundBtn" class="circle-btn" type="button" aria-label="Klausīties">🔊</button>
    </header>

    <section class="stage">
      <article id="mainCard" class="main-card">
        <div class="letter-box">
          <span id="upperLetter" class="upper-letter">A</span>
          <span id="lowerLetter" class="lower-letter">a</span>
        </div>

        <div class="image-box">
          <img id="mainImage" src="images/arbuzs.webp" alt="Arbūzs">
        </div>

        <div id="word" class="word">Arbūzs</div>

        <button id="cardSoundBtn" class="sound-fab" type="button" aria-label="Atskaņot">🔊</button>
      </article>

      <div class="counter"><span id="currentNum">1</span> / <span id="totalNum">33</span></div>
    </section>

    <section class="quick-strip-wrap">
      <div id="quickStrip" class="quick-strip" aria-label="Ātra burtu izvēle"></div>
    </section>

    <div class="hint">Pavelc, lai ātri ritinātu</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
