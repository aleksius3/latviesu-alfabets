<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#dff2ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Latviešu ABC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=13">
<title>Latviešu alfabēts</title>
</head>
<body>
<main id="app">
  <div class="sky" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="topbar">
    <button id="homeBtn" class="circle-btn hidden" aria-label="Sākums">⌂</button>
    <div class="brand"><b>Latviešu alfabēts</b><small>Mācies · Spēlē · Atklāj!</small></div>
    <button id="soundToggle" class="sound-toggle" aria-label="Ieslēgt vai izslēgt skaņu">
      <span class="sound-icon">🔊</span><i class="toggle-knob"></i>
    </button>
  </header>

  <section id="home" class="screen active">
    <div class="welcome-card">
      <div class="owl">🦉</div>
      <div class="wood-sign">
        <b>Sveiks!</b>
        <span>Mācies burtus,<br>klausies un spēlē!</span>
      </div>
    </div>

    <div class="home-actions">
      <button id="learnBtn" class="home-action learn-action">
        <div class="stack">
          <img src="images/abols.webp"><img src="images/aita.webp">
        </div>
        <div><b>Mācies</b><span>Skaties, klausies, iegaumē!</span></div>
        <i>›</i>
      </button>

      <button id="playBtn" class="home-action play-action">
        <span class="puzzle">🧩</span>
        <div><b>Spēlē</b><span>Pārbaudi savas zināšanas!</span></div>
        <i>›</i>
      </button>
    </div>

    <div class="home-stats">
      <div><span>Progress</span><b><span id="learnedCount">0</span>/33</b></div>
      <div class="stat-bar"><i id="homeProgress"></i></div>
      <div class="stat-icons"><span>📊</span><span>🏆</span><span>⭐</span><span>ℹ️</span></div>
    </div>
  </section>

  <section id="learn" class="screen">
    <div class="learn-shell">
      <div class="learn-topline">
        <button id="prevBtn" class="nav-btn">‹</button>
        <div class="step"><b id="counter">1 / 33</b><div class="step-dots" id="stepDots"></div></div>
        <button id="nextBtn" class="nav-btn">›</button>
      </div>

      <div class="stage">
        <article id="mainCard" class="main-card">
          <img id="mainImg" class="main-img" alt="">
          <div class="card-shade"></div>
          <div class="big-letter"><span id="upper">A</span><small id="lower">a</small></div>
          <div class="word-pill" id="word">Aita</div>
        </article>
      </div>

      <div class="thumb-box">
        <div id="rail" class="rail"></div>
      </div>
    </div>
  </section>

  <section id="gameMenu" class="screen">
    <div class="game-title"><span>🎮</span><div><small>IZVĒLIES SPĒLI</small><b>Spēlēsim!</b></div></div>
    <div class="game-list">
      <button class="game-card" data-game="picture"><span>🖼️</span><div><b>Atrodi attēlu</b><small>Klausies un izvēlies</small></div><i>›</i></button>
      <button class="game-card" data-game="letter"><span>🔤</span><div><b>Atrodi burtu</b><small>Skaties un izvēlies</small></div><i>›</i></button>
      <button class="game-card" data-game="memory"><span>🧠</span><div><b>Atrodi pāri</b><small>Burts + attēls</small></div><i>›</i></button>
    </div>
  </section>

  <section id="quiz" class="screen">
    <div class="quiz-head"><div><small>SPĒLE</small><h2 id="quizTitle">Atrodi attēlu</h2></div><button id="replayBtn" class="circle-btn">🔊</button></div>
    <div id="quizPrompt" class="quiz-prompt"></div>
    <div id="quizOptions" class="quiz-options"></div>
    <div id="feedback" class="feedback"></div>
    <button id="nextQuestion" class="next-question hidden">Nākamais →</button>
  </section>

  <section id="memory" class="screen">
    <div class="quiz-head"><div><small>ATRODI PĀRI</small><h2>Burts + attēls</h2></div><div class="moves">Gājieni <b id="moves">0</b></div></div>
    <div id="memoryGrid" class="memory-grid"></div>
    <div id="memoryFeedback" class="feedback"></div>
    <button id="newMemory" class="next-question hidden">Vēlreiz 🔄</button>
  </section>
</main>
<script src="app.js?v=13"></script>
</body>
</html>
